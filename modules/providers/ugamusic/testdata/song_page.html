        <script>
            (function() {
                const whatsappBtn = document.getElementById('whatsapp-button');
                if (!whatsappBtn) return;

                let isDragging = false;
                let currentX;
                let currentY;
                let initialX;
                let initialY;

                whatsappBtn.addEventListener('mousedown', startDrag);
                whatsappBtn.addEventListener('touchstart', startDrag);

                function startDrag(e) {
                    isDragging = true;
                    initialX = e.clientX || e.touches[0].clientX;
                    initialY = e.clientY || e.touches[0].clientY;

                    whatsappBtn.classList.add('dragging');

                    document.addEventListener('mousemove', drag);
                    document.addEventListener('touchmove', drag);
                    document.addEventListener('mouseup', stopDrag);
                    document.addEventListener('touchend', stopDrag);
                }

                function drag(e) {
                    if (!isDragging) return;

                    e.preventDefault();

                    currentX = e.clientX || e.touches[0].clientX;
                    currentY = e.clientY || e.touches[0].clientY;

                    const deltaX = currentX - initialX;
                    const deltaY = currentY - initialY;

                    const newX = initialX + deltaX;
                    const newY = initialY + deltaY;

                    // Constrain to viewport
                    const maxX = window.innerWidth - 80;
                    const maxY = window.innerHeight - 80;

                    const constrainedX = Math.max(0, Math.min(newX, maxX));
                    const constrainedY = Math.max(0, Math.min(newY, maxY));

                    whatsappBtn.style.left = constrainedX + 'px';
                    whatsappBtn.style.top = constrainedY + 'px';
                    whatsappBtn.style.transform = 'none';
                }

                function stopDrag() {
                    isDragging = false;
                    whatsappBtn.classList.remove('dragging');

                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('touchmove', drag);
                    document.removeEventListener('mouseup', stopDrag);
                    document.removeEventListener('touchend', stopDrag);
                }
            })();
        </script>

                        tabs_content[i].classList.add("active");
                        element.classList.add("active");
                    });
                });
        });

        // Cookie consent logic (uses cookies to persist consent)
        (function() {
            try {
                const key = 'cookie_consent_v1';
                const el = document.getElementById('cookie-consent');
                if (!el) return;

                function getCookie(name) {
                    const nameEQ = name + "=";
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        let cookie = cookies[i].trim();
                        if (cookie.indexOf(nameEQ) === 0) {
                            return cookie.substring(nameEQ.length);
                        }
                    }
                    return null;
                }

                function setCookie(name, value, days = 365) {
                    const date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    const expires = "expires=" + date.toUTCString();
                    document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Strict";
                }

                function hide() {
                    el.style.display = 'none';
                }

                function show() {
                    el.style.display = 'block';
                }

                // Check if user already gave consent
                const stored = getCookie(key);
                if (stored === 'accepted' || stored === 'dismissed') {
                    hide();
                } else {
                    show();
                }

                function dispatchConsent(type) {
                    window.dispatchEvent(new CustomEvent('cookieConsent', { 
                        detail: { type: type }
                    }));
                }

                document.getElementById('cookie-accept')?.addEventListener('click', function() {
                    setCookie(key, 'accepted', 365);
                    hide();
                    dispatchConsent('accepted');
                });

                document.getElementById('cookie-close')?.addEventListener('click', function() {
                    setCookie(key, 'dismissed', 30);
                    hide();
                    dispatchConsent('dismissed');
                });
            } catch (e) {
                // fail silently
                console.warn('Cookie consent script error', e);
            }
        })();
    </script>

            setTimeout(() => {

            if (banner) {
