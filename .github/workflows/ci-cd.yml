name: CI/CD [GitHub -> Docker Hub -> EC2]

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the tests that need it (typo-tolerant search)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 0. Tests with the race detector: a data race in shared crawler code
      #    crashed production, so nothing deploys unless this passes
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (race detector)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

      # 1. Create .env file from secret
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest .

      # 3. Login to Docker Hub
      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 22
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }} # use a proper SSH key, not Docker PAT
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

            # Recreate .env on EC2
            echo "${{ secrets.ENV_FILE }}" > .env

            # Stop old container if exists
            docker stop ${{ secrets.PROJECT_NAME }} || true
            docker rm ${{ secrets.PROJECT_NAME }} || true

            # Run container with .env
            #  --restart: come back after a crash or a host reboot
            #  --memory:  a runaway can only kill this container, not the host
            #  --log-opt: bounded logs, so they can't fill the disk
            docker run -d \
              --name ${{ secrets.PROJECT_NAME }} \
              --restart unless-stopped \
              --memory 1g --memory-swap 1g \
              --log-driver json-file --log-opt max-size=20m --log-opt max-file=5 \
              --env-file .env \
              -p ${{ secrets.PORT }}:3000 \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest